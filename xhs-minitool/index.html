    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 620px at 10% -10%, var(--glow-1), transparent 62%),
      radial-gradient(760px 520px at 96% 4%, var(--glow-2), transparent 62%),
      radial-gradient(820px 720px at 50% 112%, var(--glow-3), transparent 62%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3));
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  /* 背景照片层（上方叠加奶油色遮罩保证文字对比） */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(180deg,var(--veil-1),var(--veil-2) 42%,var(--veil-3)),
      var(--bg-photo);
    background-position:center 32%,center 32%;
    background-size:cover,cover;
    background-repeat:no-repeat,no-repeat}
  /* 页面纸张颗粒 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:var(--noise);background-size:160px 160px;
    opacity:.28;mix-blend-mode:multiply}
  .app{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:20px 16px 40px}

  /* 顶部 */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
  .title{font-size:22px;font-weight:800;letter-spacing:.5px;margin:0;
    background:linear-gradient(100deg,var(--title-1),var(--title-2) 55%,var(--title-3));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .subtitle{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1.4px}
  .badge{font-size:11px;color:var(--badge-text);border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;white-space:nowrap;background:var(--badge-bg);
    box-shadow:0 2px 8px var(--shadow-2)}

  /* 季节切换：收起为一个浮动图标 */
  .season-dock{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .season-fab{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);padding:0;
    background:var(--panel);color:var(--accent);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 14px var(--shadow-2);
    transition:transform .18s,box-shadow .18s,background .2s,color .2s}
  .season-fab:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--shadow-1)}
  .season-fab:active{transform:scale(.94)}
  .season-dock.open .season-fab{color:var(--tab-text);
    background:linear-gradient(100deg,var(--tab-1),var(--tab-2))}
  .seasons{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;
    max-width:calc(100vw - 40px);transform-origin:bottom right;
    transition:opacity .22s ease,transform .22s ease,visibility .22s;
    opacity:0;transform:translateY(6px) scale(.94);pointer-events:none;visibility:hidden}
  .season-dock.open .seasons{opacity:1;transform:none;pointer-events:auto;visibility:visible}
  .season{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;
    padding:6px 11px;border-radius:999px;cursor:pointer;transition:.2s;
    box-shadow:0 2px 8px var(--shadow-3)}
  .season .dot{width:10px;height:10px;border-radius:50%;flex:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
  .season[data-s="spring"] .dot{background:linear-gradient(135deg,#f7b8cd,#e2789c)}
  .season[data-s="summer"] .dot{background:linear-gradient(135deg,#b6e09a,#4a9a6a)}
  .season[data-s="autumn"] .dot{background:linear-gradient(135deg,#f0c48c,#c26a3f)}
  .season[data-s="winter"] .dot{background:linear-gradient(135deg,#cfe2f2,#5a86b8)}
  .season.active{color:var(--tab-text);border-color:var(--accent-border);
    background:linear-gradient(100deg,var(--tab-1),var(--tab-2));
    box-shadow:0 3px 12px var(--shadow-2)}

  /* 页签 */
  .tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;margin-bottom:18px;box-shadow:0 4px 16px var(--shadow-1)}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;
    padding:9px 0;border-radius:10px;cursor:pointer;transition:.22s;font-family:inherit}
  .tab.active{background:linear-gradient(100deg,var(--tab-1),var(--tab-2));color:var(--tab-text);
    box-shadow:inset 0 0 0 1px var(--tab-ring)}

  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 状态条 */
  .status{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);
    margin-bottom:14px;letter-spacing:.4px}
  .status b{color:var(--accent);font-weight:700}

  /* 卡牌舞台 */
  .stage{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;
    min-height:330px;align-items:center;padding:4px 0 18px}
  .stage.single .card{max-width:290px}

  .card{width:calc(50% - 7px);max-width:190px;aspect-ratio:3/4;
    perspective:1100px;cursor:pointer;user-select:none;animation:pop .38s backwards}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.93)}to{opacity:1;transform:none}}
  /* 未翻开的卡背轻微呼吸光，引导点击 */
  .card:not(.flipped) .card-back{animation:glowPulse 1.9s ease-out 2}
  @keyframes glowPulse{
    0%{box-shadow:0 14px 30px var(--back-shadow),0 0 0 0 var(--glow)}
    70%{box-shadow:0 14px 30px var(--back-shadow),0 0 0 12px transparent}
    100%{box-shadow:0 14px 30px var(--back-shadow),0 0 0 0 transparent}
  }

  /* 洗牌动画 */
  .stage.shuffling{animation:stageShake .28s ease-in-out infinite}
  @keyframes stageShake{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-2px,1px)}
    50%{transform:translate(1px,-1px)}
    75%{transform:translate(2px,1px)}
  }
  .shuffle-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;padding:24px 0}
  .shuffle-deck{position:relative;width:150px;height:200px}
  .shuffle-deck .sc{position:absolute;inset:0;border-radius:16px;
    background:
      radial-gradient(120% 100% at 20% 0%, var(--back-1), transparent 62%),
      linear-gradient(150deg,var(--back-2),var(--back-3) 72%);
    border:1px solid var(--back-border);
    box-shadow:0 12px 24px var(--back-shadow)}
  .shuffle-deck .sc::after{content:"";position:absolute;inset:8px;border-radius:10px;
    border:1px dashed var(--back-tag-line)}
  .shuffle-deck .s1{animation:shuffleL .5s ease-in-out infinite alternate}
  .shuffle-deck .s2{animation:shuffleM .62s ease-in-out infinite alternate}
  .shuffle-deck .s3{animation:shuffleR .5s ease-in-out infinite alternate}
  .shuffle-deck .s4{display:flex;align-items:center;justify-content:center;
    animation:shuffleTop .7s ease-in-out infinite alternate}
  .sc-q{font-size:42px;font-weight:800;color:var(--back-title);line-height:1;
    text-shadow:0 0 20px rgba(255,255,255,.7)}
  @keyframes shuffleL{from{transform:translate(-26px,6px) rotate(-13deg)}to{transform:translate(-14px,0) rotate(-5deg)}}
  @keyframes shuffleM{from{transform:translate(-4px,-2px) rotate(-2deg)}to{transform:translate(4px,2px) rotate(3deg)}}
  @keyframes shuffleR{from{transform:translate(26px,6px) rotate(13deg)}to{transform:translate(14px,0) rotate(5deg)}}
  @keyframes shuffleTop{from{transform:translateY(0) scale(.98)}to{transform:translateY(-8px) scale(1.03)}}
  .shuffle-tip{font-size:12px;letter-spacing:2px;color:var(--lock-text)}
  .dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);
    margin-left:5px;vertical-align:middle;animation:blink .9s infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,100%{opacity:.2;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

  .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.2,.85,.25,1)}
  .card.flipped .card-inner{transform:rotateY(180deg)}

  .card-face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;display:flex;flex-direction:column;
    padding:16px;overflow:hidden}
  /* 卡面纸张纹路 */
  .card-face::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background-image:var(--noise);background-size:150px 150px;
    opacity:.24;mix-blend-mode:multiply;pointer-events:none}

  .card-back{
    align-items:center;justify-content:center;gap:9px;
    background:
      radial-gradient(120% 100% at 20% 0%, var(--back-1), transparent 62%),
      linear-gradient(150deg,var(--back-2),var(--back-3) 72%);
    border:1px solid var(--back-border);
    box-shadow:0 14px 30px var(--back-shadow), inset 0 0 0 1px rgba(255,253,246,.2);
  }
  .card-back::after{content:"";position:absolute;inset:9px;border-radius:12px;
    border:1px dashed var(--back-tag-line);pointer-events:none}
  .back-tag{font-size:9px;letter-spacing:3px;color:var(--back-tag);
    border:1px solid var(--back-tag-line);border-radius:999px;padding:2px 9px;line-height:1.4}
  .back-title{font-size:19px;font-weight:800;color:var(--back-title);line-height:1.3;
    text-align:center;word-break:break-word;text-shadow:0 2px 12px var(--back-shadow)}
  .back-sub{font-size:9px;letter-spacing:3px;color:var(--back-tag)}

  .card-front{
    transform:rotateY(180deg);justify-content:space-between;
    background:linear-gradient(160deg,var(--front-1),var(--front-2));
    color:var(--text);border:1px solid var(--front-border);
    box-shadow:0 14px 30px var(--front-shadow), 0 0 0 1px var(--front-ring);
  }
  .card-no{font-size:10px;letter-spacing:2px;color:var(--card-no);font-weight:700}
  .card-title{margin:0;font-size:13px;font-weight:800;color:var(--accent-soft);
    letter-spacing:.6px;line-height:1.35;word-break:break-word}
  .card-text{margin:0;font-size:13.5px;line-height:1.5;font-weight:500;
    color:var(--card-text);word-break:break-word;flex:1;display:flex;align-items:center}
  .card-mark{align-self:flex-end;font-size:10px;color:var(--card-mark);letter-spacing:2px}

  .placeholder{width:100%;text-align:center;color:var(--muted);font-size:13px;line-height:2}
  .placeholder .big{font-size:40px;display:block;margin-bottom:6px;opacity:.55}

  /* 主按钮 */
  .actions{display:flex;flex-direction:column;gap:10px;align-items:center}
  .btn{font-family:inherit;font-size:14px;font-weight:700;border-radius:14px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:13px 20px;transition:.2s;width:100%;max-width:320px;
    box-shadow:0 4px 12px var(--shadow-2)}
  .btn:active{transform:scale(.97)}
  .btn-primary{
    border:0;color:#fff;font-size:16px;padding:16px 20px;
    background:linear-gradient(100deg,var(--btn-1),var(--btn-2));
    box-shadow:0 10px 24px var(--btn-shadow)
  }
  .btn-ghost{background:transparent;color:var(--btn-ghost);font-weight:600;font-size:13px;
    border-style:dashed;max-width:320px;box-shadow:none}
  .btn.is-locked{background:var(--lock-bg);color:var(--lock-text);border-color:var(--line);
    box-shadow:none}

  /* 任务弹框 */
  .modal-mask{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
    justify-content:center;padding:22px;background:var(--mask);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:.24s}
  .modal-mask.show{opacity:1;visibility:visible}
  .modal{position:relative;width:100%;max-width:340px;background:var(--panel);
    border:1px solid var(--line);border-radius:22px;padding:26px 22px 20px;
    box-shadow:0 24px 60px var(--modal-shadow);overflow:hidden;
    transform:translateY(14px) scale(.96);transition:.26s cubic-bezier(.2,.8,.3,1)}
  .modal::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background-image:var(--noise);background-size:150px 150px;
    opacity:.22;mix-blend-mode:multiply;pointer-events:none}
  .modal-mask.show .modal{transform:none}
  .modal > *{position:relative;z-index:1}
  .modal-tag{display:inline-block;font-size:10px;letter-spacing:3px;color:var(--accent-soft);
    border:1px solid var(--accent-border);border-radius:999px;padding:3px 10px}
  .modal-title{margin:14px 0 8px;font-size:22px;font-weight:800;color:var(--title-1);line-height:1.3}
  .modal-text{margin:0 0 22px;font-size:14px;line-height:1.75;color:var(--card-text)}
  .modal .btn{max-width:none;width:100%}
  .modal-later{margin-top:8px;font-size:13px}

  /* 通关页 */
  .done-mark{width:54px;height:54px;margin:2px auto 0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:800;line-height:1;color:#fff;
    background:linear-gradient(140deg,var(--accent-2),var(--accent));
    box-shadow:0 10px 24px var(--btn-shadow)}
  .done-modal .modal-title{text-align:center;margin-top:12px}
  .done-task{margin:0;text-align:center;font-size:15px;font-weight:700;
    color:var(--text);line-height:1.5}
  .done-stat{margin:8px 0 16px;text-align:center;font-size:12px;color:var(--muted)}
  .promo{margin:0 0 18px;padding:11px 14px;border-radius:14px;text-align:center;
    font-size:12.5px;line-height:1.65;color:var(--tab-text);
    background:linear-gradient(100deg,var(--tab-1),var(--tab-2));
    border:1px dashed var(--accent-border)}

  /* 设置区 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 18px var(--shadow-1)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 0}
  .row + .row{border-top:1px solid var(--row-line)}
  .label{font-size:13px;color:var(--text)}
  .label small{display:block;color:var(--muted);font-size:11px;margin-top:3px;font-weight:400}
  .seg{display:flex;gap:4px;background:var(--seg-bg);padding:3px;border-radius:11px}
  .seg button{font-family:inherit;width:34px;height:30px;border:0;border-radius:8px;
    background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
  .seg button.on{background:linear-gradient(100deg,var(--btn-1),var(--btn-2));color:#fff;
    box-shadow:0 3px 10px var(--btn-shadow)}
  .switch{width:50px;height:29px;border-radius:999px;border:1px solid var(--line);
    background:var(--switch-off);position:relative;cursor:pointer;transition:.24s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
    border-radius:50%;background:var(--front-border);box-shadow:0 1px 3px var(--mask);transition:.24s}
  .switch.on{background:var(--switch-on);border-color:var(--switch-on-border)}
  .switch.on::after{left:24px;background:var(--front-border)}

  /* 输入 */
  .input{width:100%;font-family:inherit;font-size:14px;color:var(--text);
    background:var(--input-bg);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;outline:none;transition:.2s}
  .input:focus{border-color:var(--input-focus);background:var(--panel);box-shadow:0 0 0 3px var(--input-ring)}
  .input::placeholder{color:var(--placeholder)}
  textarea.input{min-height:96px;resize:vertical;line-height:1.6}
  .inline{display:flex;gap:8px}
  .inline .btn{max-width:none;width:auto;flex:none;padding:12px 18px;font-size:13px}

  /* 列表 */
  .list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .pool-item{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;
    animation:fade .2s;box-shadow:0 3px 10px var(--shadow-3)}
  .pool-idx{font-size:10px;color:var(--placeholder);min-width:18px;font-variant-numeric:tabular-nums}
  .pool-body{flex:1;min-width:0}
  .pool-title{margin:0 0 3px;font-size:11px;font-weight:800;color:var(--accent-soft);
    letter-spacing:.5px;line-height:1.35;word-break:break-word}
  .pool-text{margin:0;line-height:1.45;color:var(--list-text);word-break:break-word}
  .del{border:0;background:transparent;color:var(--del);font-size:19px;line-height:1;
    cursor:pointer;padding:2px 6px;border-radius:8px;transition:.2s;font-family:inherit}
  .del:hover{color:#e05b4a;background:rgba(224,91,74,.1)}

  .h-item{display:flex;align-items:flex-start;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.2s;
    box-shadow:0 3px 10px var(--shadow-3)}
  .h-item.done{opacity:.55}
  .h-item.done .h-text{text-decoration:line-through}
  .h-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--h-dot-line);
    flex:none;margin-top:2px;transition:.2s;position:relative}
  .h-item.done .h-dot{background:var(--ok);border-color:var(--ok)}
  .h-item.done .h-dot::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;
    border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
  .h-body{flex:1;min-width:0}
  .h-text{margin:0;font-size:13px;line-height:1.5;word-break:break-word}
  .h-title{margin:0 0 3px;font-size:11px;font-weight:800;color:var(--accent-soft);
    letter-spacing:.5px;line-height:1.35;word-break:break-word}
  .h-time{font-size:10px;color:var(--muted);letter-spacing:.4px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 0}
  .count-tip{font-size:12px;color:var(--muted);margin:0 0 10px;letter-spacing:.4px}
  .count-tip b{color:var(--accent)}

  /* 提示条 */
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,16px);background:var(--toast-bg);color:var(--toast-text);
    border:1px solid rgba(255,250,240,.18);border-radius:12px;padding:11px 18px;font-size:13px;
    opacity:0;pointer-events:none;transition:.28s;z-index:99;
    box-shadow:0 12px 30px var(--modal-shadow);max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:380px){
    .card-text{font-size:13.5px}
    .title{font-size:19px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div>
      <h1 class="title">四季散步任务卡</h1>
      <!-- <div class="subtitle">CITY WALK QUEST</div> -->
    </div>
    <div class="badge" id="headBadge">卡池 0 张</div>
  </div>

  <div class="season-dock" id="seasonDock">
    <div class="seasons" id="seasons" role="group" aria-label="主题季节">
      <button class="season" data-s="spring" aria-pressed="false"><i class="dot"></i>春</button>
      <button class="season" data-s="summer" aria-pressed="false"><i class="dot"></i>夏</button>
      <button class="season" data-s="autumn" aria-pressed="false"><i class="dot"></i>秋</button>
      <button class="season" data-s="winter" aria-pressed="false"><i class="dot"></i>冬</button>
    </div>
    <button class="season-fab" id="seasonFab" type="button" title="切换主题" aria-label="切换主题"
      aria-expanded="false" aria-controls="seasons">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.3-1.9-.3-.9.1-1.8 1-2 .9-.2 1.7.4 2.1 1.2.4.8 1.2 1.2 2 1A8.7 8.7 0 0 0 21 12a9 9 0 0 0-9-9Z"/>
        <circle cx="8.6" cy="9.2" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="13" cy="7.4" r="1.15" fill="currentColor" stroke="none" opacity=".7"/>
        <circle cx="7.4" cy="14" r="1.15" fill="currentColor" stroke="none" opacity=".5"/>
      </svg>
    </button>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="draw">抽卡</button>
    <button class="tab" data-view="pool">卡池</button>
    <button class="tab" data-view="history">记录</button>
  </div>

  <!-- 抽卡 -->
  <section class="view active" id="view-draw">
    <div class="status">
      <span>本轮剩余 <b id="statRemain">0</b> 张</span>
      <span>已抽 <b id="statDrawn">0</b> 张</span>
    </div>

    <div class="stage" id="stage"></div>

    <div class="actions">
      <button class="btn btn-primary" id="btnDraw">抽 一 张</button>
      <button class="btn" id="btnFlipAll" style="display:none">全部翻开</button>
      <button class="btn btn-ghost" id="btnResetRound">重置本轮进度</button>
    </div>

    <div class="panel" style="margin-top:18px">
      <div class="row">
        <span class="label">每次抽取<small>一次抽几张卡</small></span>
        <div class="seg" id="countSeg"></div>
      </div>
      <div class="row">
        <span class="label">不重复抽取<small>抽完一轮自动洗牌</small></span>
        <button class="switch" id="switchRepeat"></button>
      </div>
    </div>
  </section>

  <!-- 卡池 -->
  <section class="view" id="view-pool">
    <p class="count-tip">当前卡池共 <b id="poolCount">0</b> 张任务卡</p>

    <div class="panel">
      <input class="input" id="inputTitle" placeholder="小标题，如：最小门店" maxlength="12">
      <div style="height:8px"></div>
      <input class="input" id="inputText" placeholder="任务内容，如：找到一家门面最小的店，进去买一样东西" maxlength="60">
      <div style="height:10px"></div>
      <button class="btn" id="btnAddOne" style="width:100%;max-width:none">添加到卡池</button>
      <div style="height:12px"></div>
      <textarea class="input" id="inputBatch" placeholder="批量导入：每行一条，格式「小标题|任务内容」&#10;没有竖线时自动取前 6 个字作标题&#10;例如：&#10;最小门店|找到一家门面最小的店，进去买一样东西&#10;红色路牌|拍一张有红色元素的路牌"></textarea>
      <div style="height:10px"></div>
      <div class="inline">
        <button class="btn" id="btnImport" style="flex:1">批量导入</button>
        <button class="btn" id="btnRestore" style="flex:1">恢复默认</button>
        <button class="btn" id="btnClearPool" style="flex:1">清空</button>
      </div>
    </div>

    <div class="list" id="poolList"></div>
  </section>

  <!-- 记录 -->
  <section class="view" id="view-history">
    <p class="count-tip">已抽 <b id="hTotal">0</b> 张 · 完成 <b id="hDone">0</b> 张 · 点击卡片标记完成</p>
    <div class="list" id="historyList"></div>
    <div style="height:14px"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnClearHistory">清空记录</button>
    </div>
  </section>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <span class="modal-tag">当前任务</span>
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-text" id="modalText"></p>
    <button class="btn btn-primary" id="modalDone">✓ 已完成，继续抽卡</button>
    <button class="btn btn-ghost modal-later" id="modalLater">先收起，稍后再做</button>
  </div>
</div>

<!-- 通关页：完成任务后的引流提示 -->
<div class="modal-mask" id="doneMask">
  <div class="modal done-modal" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <div class="done-mark" aria-hidden="true">✓</div>
    <h2 class="modal-title" id="doneTitle">任务完成</h2>
    <p class="done-task" id="doneTask"></p>
    <p class="done-stat" id="doneStat"></p>
    <p class="promo" id="promoText"></p>
    <button class="btn btn-primary" id="doneNext">再抽一张</button>
    <button class="btn btn-ghost modal-later" id="doneClose">先收起</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
